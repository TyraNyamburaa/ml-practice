[project]
name = "68-algorithms-challenge"
version = "0.1.0"
description = "Journey to mastering 68 machine learning algorithms step-by-step."
authors = [
    {name = "Tyra Nyambura", email = "tyranyambura@gmail.com"}
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "notebook>=7.1.0"
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.9",
    "pre-commit>=3.5.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"algorithms/**/*.ipynb" = ["F401"]
