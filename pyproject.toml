[project]
name = "68-algorithms-challenge"
version = "0.1.0"
description = "Journey to mastering 68 machine learning algorithms step-by-step."
authors = [
    {name = "Tyra Nyambura", email = "tyranyamburaa@gmail.com"}
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "notebook>=7.1.0"
]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
